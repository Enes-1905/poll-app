<section class="create-survey">
  <div class="create-survey__header">
    <div>
      <span class="create-survey__badge">Draft</span>
      <h1>Create new survey</h1>
    </div>

    <button class="create-survey__cancel" type="button">
      Cancel <span aria-hidden="true">×</span>
    </button>
  </div>

  <div class="create-survey__form">
    <div class="create-survey__fields">
      <div class="create-survey__left">
        <div class="create-survey__field">
          <label for="survey-name">Survey name</label>

          <div class="create-survey__input-row">
            <input id="survey-name" type="text" />

            <button
              class="create-survey__delete"
              type="button"
              aria-label="Clear survey name"
            >
              🗑
            </button>
          </div>
        </div>

        <div class="create-survey__bottom-fields">
          <div class="create-survey__field">
            <label for="survey-date">
              Set end date <span>(optional)</span>
            </label>

            <div class="create-survey__input-row">
              <input id="survey-date" type="date" />

              <button
                class="create-survey__delete"
                type="button"
                aria-label="Clear end date"
              >
                🗑
              </button>
            </div>
          </div>

          <div class="create-survey__field">
            <label for="survey-category">Choose category</label>

            <select id="survey-category">
              <option value="">Choose category</option>
              <option value="all">All Surveys</option>
              <option value="team">Team Activities</option>
              <option value="health">Health & Wellness</option>
              <option value="gaming">Gaming & Entertainment</option>
              <option value="education">Education & Learning</option>
              <option value="lifestyle">Lifestyle & Preferences</option>
              <option value="technology">Technology & Innovation</option>
            </select>
          </div>
        </div>
      </div>

      <div class="create-survey__right">
        <div class="create-survey__field">
          <label for="survey-description">
            Describing text <span>(optional)</span>
          </label>

          <div class="create-survey__input-row">
            <textarea id="survey-description"></textarea>

            <button
              class="create-survey__delete"
              type="button"
              aria-label="Clear description"
            >
              🗑
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
